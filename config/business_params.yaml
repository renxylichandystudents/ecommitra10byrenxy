# Parameter bisnis default. Nilai ini dipakai bila data belum tersedia.
# Perubahan dari UI disimpan per pengguna, file ini tetap sebagai default.

lead_time:
  lokal_hari: 7            # Gudang Cipeucang / DC Cikupa ke pembeli
  lokal_sigma_hari: 0      # 0 = lead time lokal dianggap stabil
  review_hari: 7           # periode tinjau stok (evaluasi mingguan): SS = Z × σ × √(L + R)
  impor_aktif: false
  impor_rata_hari: 60
  impor_maks_hari: 90

gudang:
  kapasitas_unit: 100000
  moq_unit: 1
  biaya_simpan_pct_tahun: 20     # persen dari harga per unit per tahun
  biaya_pesan_rp: 150000         # biaya sekali pesan untuk EOQ
  biaya_kehabisan_pct: 30        # persen dari harga jual per unit yang hilang

# Target tingkat layanan per kelas ABC (QTY 90 hari): selisih poin dari tingkat layanan pilihan (= kelas B), batas 80–99%.
layanan_kelas:
  A: 2
  B: 0
  C: -7

margin:
  hpp_pct_harga: 80              # HPP diasumsikan 80% dari harga jual bersih
  margin_min_pct: 8              # batas margin minimum flash sale / markdown

target:
  sales_bulanan_rp: 0            # 0 = memakai prediksi sebagai target

iklan:
  target_roas: 8
  budget_maks_rp: 5000000
  porsi_sales_iklan_default_pct: 30
  roas_default: 6

label:
  terlaris_top_n: 10
  populer_top_pct: 10
  diminati_top_pct: 10
  perlu_perhatian_batal_pct: 15
  perlu_perhatian_kali_median: 2

shopee:
  judul_maks_karakter: 120
  judul_min_karakter: 25
  deskripsi_maks_karakter: 3000
  flash_sale_diskon_pct: [10, 15, 20]
  flash_sale_kuota_pct_surplus: 50
  flash_sale_template_kolom:
    - Tanggal
    - SKU
    - Nama Produk
    - Harga Normal
    - Harga Flash Sale
    - Stok Flash Sale
    - Batas Pembelian

merek:
  - mitra10
  - avian
  - dulux
  - nippon
  - jotun
  - mowilex
  - no drop
  - aquaproof
  - tiga roda
  - holcim
  - dynamix
  - wavin
  - rucika
  - toto
  - american standard
  - wasser
  - philips
  - panasonic
  - broco
  - krisbow

# Setelan data latih untuk setiap analisa baru (keputusan 7 Nov 2026: prediksi stok tanpa pesanan batal & retur).
analisa:
  kecualikan_batal_retur: true

# Batas kapasitas database (Supabase gratis 500 MB). Satu analisa ±9 MB (file hasil + snapshot prediksi).
penyimpanan:
  maks_riwayat_analisa: 12      # analisa terbaru yang disimpan beserta file hasilnya
  maks_snapshot_prediksi: 30    # analisa terbaru yang snapshot prediksinya disimpan (uji maju tesis)
  hari_log_aktivitas: 180
  batas_darurat_mb: 400         # di atas ini analisa tertua dihapus sampai turun (minimal tersisa 3)
  kuota_mb: 500
  minimal_tersisa: 3
