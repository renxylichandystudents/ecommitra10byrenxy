[server]
headless = true
port = 8501
fileWatcherType = "none"
runOnSave = false
maxUploadSize = 200

[browser]
gatherUsageStats = false

# Tabel st.dataframe disamakan dengan tabel kustom di components/top50_table/index.html.
[theme]
base = "light"
primaryColor = "#0f766e"
backgroundColor = "#f4f7f6"
secondaryBackgroundColor = "#ffffff"
textColor = "#1e293b"
font = "Manrope:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap, sans-serif"
dataframeHeaderBackgroundColor = "#edf5f3"
dataframeBorderColor = "#d5e3df"
