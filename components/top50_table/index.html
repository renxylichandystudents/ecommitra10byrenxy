<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* Skala sama dengan :root di app.py */
  :root { --fs-xs: 0.75rem; --fs-sm: 0.85rem; --fs-base: 0.95rem; }
  html, body { margin: 0; padding: 0; background: transparent; font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }
  /* Warna, border, dan ukuran huruf disamakan dengan st.dataframe (lihat [theme] di .streamlit/config.toml). */
  .box {
    overflow: auto;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    background: #ffffff;
    scrollbar-color: #334155 #e2e8f0;
  }
  .box::-webkit-scrollbar { width: 14px; height: 14px; }
  .box::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }
  .box::-webkit-scrollbar-track { background: #e2e8f0; }
  table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 0.875rem; color: #31333f; }
  th, td {
    padding: 8px;
    min-height: 35px;
    border-bottom: 1px solid #e2e8f0;
    border-right: 1px solid #e2e8f0;
    white-space: nowrap;
    text-align: left;
    background: #ffffff;
    box-sizing: border-box;
    vertical-align: top;
  }
  thead { user-select: none; }
  thead th { position: sticky; z-index: 4; background: #f1f5f9; font-weight: 400; color: #6b6d76; }
  thead th.group { text-align: center; background: #e9eef5; border-left: 1px solid #cbd5e1; font-weight: 600; color: #475569; }
  thead th.leaf.first, td.first { border-left: 1px solid #cbd5e1; }
  thead tr.total th { background: #f8fafc; font-weight: 700; color: #31333f; }
  th.num, td.num { text-align: right; }
  th.movable { cursor: grab; }
  th.sortable { cursor: pointer; }
  th.sortable.movable { cursor: grab; }
  th.sortable:hover, th.movable:hover { background: #e2e8f0; }
  th.drag-src, td.drag-src { opacity: 0.45; }
  th.drop-before { box-shadow: inset 3px 0 0 #ee4d2d; }
  th.drop-after { box-shadow: inset -3px 0 0 #ee4d2d; }
  body.dragging, body.dragging * { cursor: grabbing !important; }
  body.resizing, body.resizing * { cursor: col-resize !important; }
  .rs { position: absolute; top: 0; right: -3px; width: 7px; height: 100%; cursor: col-resize; z-index: 9; }
  .rs:hover, .rs.on { background: rgba(238, 77, 45, 0.35); }
  .arrow { color: #94a3b8; font-size: var(--fs-xs); margin-left: 4px; visibility: hidden; }
  th:hover .arrow, th.sorted .arrow { visibility: visible; }
  th.sorted .arrow { color: #0f172a; }
  .pin { position: sticky; }
  thead .pin { z-index: 6; }
  thead tr.total .pin { z-index: 7; }
  tbody .pin { z-index: 2; }
  .pin-last { box-shadow: 1px 0 0 #e2e8f0, 6px 0 10px rgba(15, 23, 42, 0.06); }
  td.name, th.name { white-space: normal; }
  /* Nama produk maksimal 2 baris; nama lengkap di tooltip. */
  td.name .main { overflow-wrap: anywhere; }
  tbody tr:hover td { background: #f8fafc; }
  tbody tr.picked td { background: #eff6ff; }
  .main { font-weight: 400; }
  thead tr.total .main { font-weight: 700; }
  .move { font-size: var(--fs-xs); font-weight: 700; margin-top: 2px; }
  .move.up { color: #1d4ed8; }
  .move.down { color: #dc2626; }
  .move.flat { color: #94a3b8; font-weight: 500; }
  .sub { font-size: var(--fs-xs); color: #64748b; margin-top: 2px; font-weight: 500; }
  .kicker { display: block; font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #64748b; margin-bottom: 2px; }
  input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #ee4d2d; margin: 0; }
  th.tone-extra, td.tone-extra { background: #eff6ff; }
  thead th.group.tone-extra { background: #dbeafe; }
  th.tone-stock, td.tone-stock { background: #fff7ed; }
  thead th.group.tone-stock { background: #ffedd5; }
  td.st-ok .main { color: #15803d; }
  td.st-thin { background: #fefce8 !important; }
  td.st-thin .main { color: #a16207; }
  td.st-short, td.st-empty { background: #fef2f2 !important; }
  td.st-short .main, td.st-empty .main { color: #b91c1c; }
  .labels { font-size: var(--fs-xs); color: #475569; margin-top: 3px; white-space: normal; }
  .labels .chip.more { cursor: help; background: #f1f5f9; }
  /* Muat lebih banyak: 5 baris, +10 per klik, Tutup kembali ke 5 (sama dengan batched_view di Streamlit). */
  .info { color: #64748b; font-size: var(--fs-sm); font-weight: 600; }
  /* Bilah tombol bawah: sama dengan tombol Streamlit di app.py (Muat = primary oranye, Tutup = putih, Unduh = hijau). */
  .foot { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 2px 6px; }
  .foot .row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 260px); gap: 10px; justify-content: center; width: 100%; }
  .btn { font-family: inherit; font-weight: 700; font-size: 0.95rem; border-radius: 12px; min-height: 2.75rem; padding: 0 16px;
    cursor: pointer; border: 1px solid #d0d5dd; background: #fff; color: #0f172a; display: inline-flex; align-items: center;
    justify-content: center; gap: 8px; white-space: nowrap; text-decoration: none; box-sizing: border-box;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(15, 23, 42, 0.08); }
  .btn.primary { background: linear-gradient(135deg, #ff7348 0%, #ee4d2d 100%); border: none; color: #fff; }
  .btn.primary:hover { background: linear-gradient(135deg, #ff8158 0%, #e24122 100%); }
  .btn.dl { background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%); border: 1px solid #6ee7b7; color: #065f46; }
  .btn.dl:hover { background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%); border-color: #34d399; color: #064e3b; }
  .btn svg { width: 18px; height: 18px; flex: 0 0 auto; }
  .done { border: 1px solid #a7f3d0; background: #ecfdf5; color: #047857; border-radius: 10px; padding: 6px 14px; text-align: center; font-size: var(--fs-sm); }
  .chip { display: inline-block; padding: 1px 6px; margin: 2px 4px 0 0; border-radius: 999px; background: #f1f5f9; border: 1px solid #e2e8f0; font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const state = { sortId: null, sortDir: 1, selected: "", args: null, order: null, widths: {}, justDragged: false, shown: 0, sig: "" };

  const DRAG_PX = 5;
  const MIN_WIDTH = 56;

  /* Kolom sesuai urutan & lebar yang diatur pengguna; kolom baru dari server ditaruh di posisi aslinya. */
  function orderedColumns(args) {
    const byId = {};
    args.columns.forEach((c) => { byId[c.id] = c; });
    const ids = (state.order || []).filter((id) => byId[id]);
    args.columns.forEach((c, i) => { if (!ids.includes(c.id)) ids.splice(Math.min(i, ids.length), 0, c.id); });
    state.order = ids;
    return ids.map((id) => {
      const c = Object.assign({}, byId[id]);
      if (state.widths[id]) c.width = state.widths[id];
      return c;
    });
  }

  /* Blok = satu kolom tunggal atau satu grup kolom; blok hanya pindah di zona yang sama (terkunci kiri / bebas). */
  function blocksOf(cols) {
    const blocks = [];
    cols.forEach((c) => {
      const last = blocks[blocks.length - 1];
      if (c.group && last && last.group === c.group) last.ids.push(c.id);
      else blocks.push({ group: c.group || null, pin: !!c.pin, fixed: c.id === "pick", ids: [c.id] });
    });
    return blocks;
  }

  function moveBlock(cols, srcId, dstId, after) {
    const blocks = blocksOf(cols);
    const src = blocks.findIndex((b) => b.ids.includes(srcId));
    const dst = blocks.findIndex((b) => b.ids.includes(dstId));
    if (src < 0 || dst < 0 || src === dst || blocks[src].pin !== blocks[dst].pin || blocks[dst].fixed) return null;
    const [block] = blocks.splice(src, 1);
    let at = blocks.findIndex((b) => b.ids.includes(dstId)) + (after ? 1 : 0);
    if (blocks[0] && blocks[0].fixed) at = Math.max(at, 1);
    blocks.splice(at, 0, block);
    return [].concat(...blocks.map((b) => b.ids));
  }

  function moveLeaf(srcId, dstId, after) {
    const ids = state.order.slice();
    const from = ids.indexOf(srcId);
    if (from < 0 || srcId === dstId) return null;
    ids.splice(from, 1);
    ids.splice(ids.indexOf(dstId) + (after ? 1 : 0), 0, srcId);
    return ids;
  }

  function post(type, extra) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
  }

  function setValue(value) {
    post("streamlit:setComponentValue", { value: value, dataType: "json" });
  }

  function esc(text) {
    return String(text == null ? "" : text)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  const ICON_DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
  const ICON_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>';
  const ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><polyline points="7 10 12 15 17 10"/><path d="M5 20h14"/></svg>';

  /* Unduh Excel dari dalam komponen: isi file (base64) dikirim Python, sehingga tombol berada di bilah yang sama. */
  function downloadButton(args) {
    const d = args.download;
    if (!d || !d.b64) return "";
    return `<button class="btn dl" data-act="download">${ICON_DL} ${esc(d.label || "Unduh Excel")}</button>`;
  }

  function saveDownload(d) {
    const raw = atob(d.b64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = d.name || "tabel.xlsx";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  function cellHtml(cell) {
    if (!cell) return "";
    let out = `<div class="main" title="${esc(cell.t)}">${esc(cell.t)}</div>`;
    if (cell.d) out += `<div class="move ${esc(cell.dc || "flat")}">${esc(cell.d)}</div>`;
    if (cell.s) out += `<div class="sub">${esc(cell.s)}</div>`;
    // Satu label utama + "+n" (label lain di tooltip) agar baris tidak memanjang 2 baris karena lencana.
    if (cell.l && cell.l.length) {
      const rest = cell.l.slice(1);
      const more = rest.length ? `<span class="chip more" title="${esc(rest.join(" · "))}">+${rest.length}</span>` : "";
      out += `<div class="labels"><span class="chip">${esc(cell.l[0])}</span>${more}</div>`;
    }
    return out;
  }

  function sortedRows(args) {
    const rows = args.rows.slice();
    if (!state.sortId) return rows;
    const id = state.sortId;
    rows.sort((a, b) => {
      const x = a.cells[id] ? a.cells[id].v : null;
      const y = b.cells[id] ? b.cells[id].v : null;
      if (x === y) return (a.cells.rank.v - b.cells.rank.v);
      if (x === null || x === undefined) return 1;
      if (y === null || y === undefined) return -1;
      if (typeof x === "number" && typeof y === "number") return (x - y) * state.sortDir;
      return String(x).localeCompare(String(y), "id") * state.sortDir;
    });
    return rows;
  }

  function render() {
    const args = state.args;
    if (!args) return;
    const cols = orderedColumns(args);
    const pinned = cols.filter((c) => c.pin);
    let left = 0;
    const lefts = {};
    pinned.forEach((c) => { lefts[c.id] = left; left += c.width; });
    const lastPin = pinned.length ? pinned[pinned.length - 1].id : null;

    function cls(c, extra) {
      const parts = [];
      if (c.kind === "num") parts.push("num");
      if (c.kind === "name") parts.push("name");
      if (c.pin) parts.push("pin");
      if (c.id === lastPin) parts.push("pin-last");
      if (c.first) parts.push("first");
      if (c.tone) parts.push("tone-" + c.tone);
      if (extra) parts.push(extra);
      return parts.join(" ");
    }
    function style(c) {
      let s = "";
      if (c.width) s += `width:${c.width}px;min-width:${c.width}px;max-width:${c.width}px;`;
      if (c.pin) s += `left:${lefts[c.id]}px;`;
      return s;
    }
    function arrow(c) {
      if (!c.sort) return "";
      const on = state.sortId === c.id;
      return `<span class="arrow">${on ? (state.sortDir > 0 ? "▲" : "▼") : "↕"}</span>`;
    }

    let row1 = "";
    let row2 = "";
    for (let i = 0; i < cols.length; i++) {
      const c = cols[i];
      if (!c.group) {
        const fixed = c.id === "pick";
        const sortCls = (c.sort ? "sortable" + (state.sortId === c.id ? " sorted" : "") : "") + (fixed ? "" : " movable");
        const kicker = c.kicker ? `<span class="kicker">${esc(c.kicker)}</span>` : "";
        const attrs = fixed ? "" : ` data-col="${esc(c.id)}" data-move="block"`;
        row1 += `<th rowspan="2"${attrs} data-sort="${c.sort ? c.id : ""}" class="${cls(c, sortCls)} r1" style="${style(c)}">${kicker}${esc(c.label)}${arrow(c)}${fixed ? "" : `<span class="rs" data-rs="${esc(c.id)}"></span>`}</th>`;
        continue;
      }
      let span = 1;
      while (i + span < cols.length && cols[i + span].group === c.group) span++;
      row1 += `<th colspan="${span}" data-col="${esc(c.id)}" data-move="block" class="group movable r1${c.tone ? " tone-" + c.tone : ""}">${esc(c.group)}</th>`;
      for (let j = i; j < i + span; j++) {
        const leaf = cols[j];
        leaf.first = j === i;
        const sortCls = (leaf.sort ? "sortable" + (state.sortId === leaf.id ? " sorted" : "") : "") + " movable";
        row2 += `<th data-col="${esc(leaf.id)}" data-move="leaf" data-group="${esc(leaf.group)}" data-sort="${leaf.sort ? leaf.id : ""}" class="leaf ${cls(leaf, sortCls)} r2" style="${style(leaf)}">${esc(leaf.label)}${arrow(leaf)}<span class="rs" data-rs="${esc(leaf.id)}"></span></th>`;
      }
      i += span - 1;
    }
    let row3 = "";
    cols.forEach((c) => {
      if (c.id === "pick") { row3 += `<th class="${cls(c)} r3" style="${style(c)}"></th>`; return; }
      row3 += `<th data-c="${esc(c.id)}" class="${cls(c)} r3" style="${style(c)}">${cellHtml(args.total[c.id])}</th>`;
    });

    // limit: tampil N baris teratas SETELAH diurutkan (urut tetap atas semua baris); Muat lagi menambah limit dari Streamlit.
    const limit = Number(args.limit) > 0 ? Number(args.limit) : Infinity;
    const batch = args.batch && args.rows.length > (args.batch.first || 5) ? args.batch : null;
    const allRows = sortedRows(args);
    function rowHtml(r) {
      const picked = r.key === state.selected;
      const tds = cols.map((c) => {
        if (c.id === "pick") {
          return `<td class="${cls(c)}" style="${style(c)}"><input type="checkbox" data-key="${esc(r.key)}" ${picked ? "checked" : ""} /></td>`;
        }
        const cell = r.cells[c.id];
        return `<td data-c="${esc(c.id)}" class="${cls(c, cell && cell.c ? cell.c : "")}" style="${style(c)}">${cellHtml(cell)}</td>`;
      }).join("");
      return `<tr class="${picked ? "picked" : ""}">${tds}</tr>`;
    }
    let body = "";
    let foot = "";
    if (batch) {
      const first = batch.first || 5;
      const step = batch.step || 10;
      const noun = esc(batch.noun || "baris");
      const total = allRows.length;
      const shown = Math.min(total, Math.max(first, state.shown || first));
      state.shown = shown;
      body = allRows.slice(0, shown).map(rowHtml).join("");
      const rest = total - shown;
      const info = rest > 0 ? "" : `<div class="done"><b>✓ Semua data telah ditampilkan</b> ${total} dari ${total} ${noun}</div>`;
      const more = rest > 0 ? `<button class="btn primary" data-act="more">${ICON_DOWN} Muat lebih banyak (+${Math.min(step, rest)})</button>` : "";
      const close = shown > first ? `<button class="btn" data-act="close">${ICON_UP} Tutup</button>` : "";
      foot = `<div class="foot">${info}<div class="row">${more}${close}${downloadButton(args)}</div></div>`;
    } else {
      body = allRows.slice(0, limit).map(rowHtml).join("");
      if (args.download) foot = `<div class="foot"><div class="row">${downloadButton(args)}</div></div>`;
    }

    const root = document.getElementById("root");
    const box = root.querySelector(".box");
    const keepTop = box ? box.scrollTop : 0;
    const keepLeft = box ? box.scrollLeft : 0;
    let viewport = 0;
    try { viewport = window.top.innerHeight || 0; } catch (err) { viewport = 0; }
    const maxHeight = viewport > 0 ? Math.min(args.height, Math.round(viewport * 0.7)) : args.height;
    root.innerHTML =
      `<div class="box" style="max-height:${maxHeight}px"><table><thead>` +
      `<tr class="h1">${row1}</tr><tr class="h2">${row2}</tr><tr class="total">${row3}</tr>` +
      `</thead><tbody>${body}</tbody></table></div>${foot}`;

    const table = root.querySelector("table");
    const h1 = table.querySelector("tr.h1").getBoundingClientRect().height;
    const h2 = table.querySelector("tr.h2").getBoundingClientRect().height;
    table.querySelectorAll("th.r1").forEach((th) => { th.style.top = "0px"; });
    table.querySelectorAll("th.r2").forEach((th) => { th.style.top = h1 + "px"; });
    table.querySelectorAll("th.r3").forEach((th) => { th.style.top = h1 + h2 + "px"; });

    root.querySelectorAll("th[data-sort]").forEach((th) => {
      const id = th.getAttribute("data-sort");
      if (!id) return;
      th.addEventListener("click", () => {
        if (state.justDragged) return;
        if (state.sortId === id) state.sortDir = -state.sortDir;
        else { state.sortId = id; state.sortDir = args.columns.find((c) => c.id === id).kind === "num" && id !== "rank" ? -1 : 1; }
        render();
      });
    });
    root.querySelectorAll(".rs").forEach((handle) => {
      handle.addEventListener("mousedown", (event) => startResize(event, handle.getAttribute("data-rs"), handle));
      handle.addEventListener("click", (event) => event.stopPropagation());
    });
    root.querySelectorAll("th[data-move]").forEach((th) => {
      th.addEventListener("mousedown", (event) => startMove(event, th));
    });
    table.querySelector("thead").addEventListener("dragstart", (event) => event.preventDefault());
    root.querySelectorAll("input[type=checkbox]").forEach((box) => {
      box.addEventListener("change", () => {
        const key = box.getAttribute("data-key");
        state.selected = box.checked ? key : "";
        render();
        setValue(state.selected);
      });
    });

    root.querySelectorAll("[data-act]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const batch = state.args.batch || {};
        if (btn.getAttribute("data-act") === "download") { saveDownload(state.args.download); return; }
        if (btn.getAttribute("data-act") === "more") state.shown += batch.step || 10;
        else state.shown = batch.first || 5;
        render();
      });
    });

    const newBox = root.querySelector(".box");
    newBox.scrollTop = keepTop;
    newBox.scrollLeft = keepLeft;
    postHeight();
  }

  /* Tinggi iframe mengikuti isi: diukur ulang setiap ukuran berubah (font selesai dimuat, baris bertambah,
     lebar kolom diubah). Tanpa ini, baris yang terlipat setelah font dimuat membuat tombol Muat lebih banyak
     dan scrollbar terpotong di bawah iframe. */
  // Tinggi selalu dikirim (tanpa dedup): pesan pertama bisa hilang bila Streamlit belum siap menerima,
  // dan pada layar sempit baris terlipat lebih banyak sehingga tinggi akhir baru diketahui setelah layout stabil.
  function postHeight() {
    const root = document.getElementById("root");
    const height = Math.ceil(root.scrollHeight || root.getBoundingClientRect().height) + 8;
    post("streamlit:setFrameHeight", { height: height });
  }
  if (window.ResizeObserver) new ResizeObserver(() => postHeight()).observe(document.getElementById("root"));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => postHeight());
  window.addEventListener("load", () => postHeight());
  window.addEventListener("resize", () => postHeight());
  // Kirim ulang beberapa kali di awal (layout iframe, font, dan lebar kolom bisa berubah setelah render pertama).
  [150, 400, 800, 1500, 3000, 6000].forEach((ms) => setTimeout(postHeight, ms));

  function markDragged() {
    state.justDragged = true;
    setTimeout(() => { state.justDragged = false; }, 120);
  }

  function track(onMove, onUp) {
    function up(event) {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", up);
      onUp(event);
    }
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", up);
  }

  /* Tarik tepi kanan judul kolom untuk mengubah lebar (seperti st.dataframe). */
  function startResize(event, id, handle) {
    if (event.button !== 0) return;
    event.preventDefault();
    event.stopPropagation();
    const startX = event.clientX;
    const startW = handle.parentElement.getBoundingClientRect().width;
    let moved = false;
    let frame = 0;
    handle.classList.add("on");
    document.body.classList.add("resizing");
    track((e) => {
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 1) moved = true;
      state.widths[id] = Math.max(MIN_WIDTH, Math.round(startW + dx));
      if (!frame) frame = requestAnimationFrame(() => { frame = 0; render(); });
    }, () => {
      document.body.classList.remove("resizing");
      if (moved) markDragged();
      render();
    });
  }

  /* Klik-tahan bagian tengah judul lalu geser: pindah kolom. Klik biasa tetap untuk urutkan. */
  function startMove(event, th) {
    if (event.button !== 0 || event.target.classList.contains("rs")) return;
    event.preventDefault();
    const srcId = th.getAttribute("data-col");
    const leafMode = th.getAttribute("data-move") === "leaf";
    const group = th.getAttribute("data-group");
    const pinned = th.classList.contains("pin");
    const startX = event.clientX;
    const root = document.getElementById("root");
    const box = root.querySelector(".box");
    let dragging = false;
    let target = null;

    function candidates() {
      if (leafMode) return [...root.querySelectorAll("tr.h2 th[data-move=leaf]")].filter((x) => x.getAttribute("data-group") === group);
      return [...root.querySelectorAll("tr.h1 th[data-move=block]")].filter((x) => x.classList.contains("pin") === pinned);
    }

    function clearDrop() {
      root.querySelectorAll(".drop-before, .drop-after").forEach((x) => x.classList.remove("drop-before", "drop-after"));
    }

    track((e) => {
      if (!dragging && Math.abs(e.clientX - startX) < DRAG_PX) return;
      if (!dragging) {
        dragging = true;
        document.body.classList.add("dragging");
        const cols = orderedColumns(state.args);
        const ids = leafMode ? [srcId] : (blocksOf(cols).find((b) => b.ids.includes(srcId)) || { ids: [srcId] }).ids;
        ids.forEach((id) => root.querySelectorAll(`th[data-col="${id}"]:not(.group), [data-c="${id}"]`).forEach((x) => x.classList.add("drag-src")));
        th.classList.add("drag-src");
      }
      const rect = box.getBoundingClientRect();
      if (e.clientX < rect.left + 40) box.scrollLeft -= 20;
      else if (e.clientX > rect.right - 40) box.scrollLeft += 20;
      clearDrop();
      target = null;
      let best = null;
      let bestDist = Infinity;
      candidates().forEach((x) => {
        const r = x.getBoundingClientRect();
        const dist = e.clientX < r.left ? r.left - e.clientX : e.clientX > r.right ? e.clientX - r.right : 0;
        if (dist < bestDist) { bestDist = dist; best = x; }
      });
      if (!best || best === th) return;
      const r = best.getBoundingClientRect();
      const after = e.clientX > r.left + r.width / 2;
      best.classList.add(after ? "drop-after" : "drop-before");
      target = { id: best.getAttribute("data-col"), after: after };
    }, () => {
      document.body.classList.remove("dragging");
      if (!dragging) return;
      markDragged();
      if (target) {
        const next = leafMode ? moveLeaf(srcId, target.id, target.after) : moveBlock(orderedColumns(state.args), srcId, target.id, target.after);
        if (next) state.order = next;
      }
      render();
    });
  }

  window.addEventListener("message", (event) => {
    const data = event.data || {};
    if (data.type !== "streamlit:render") return;
    const args = data.args || {};
    const first = state.args === null;
    state.args = args;
    // Data berganti (mis. rentang tanggal lain): kembali ke 5 baris.
    const sig = (args.rows || []).length + "|" + ((args.rows || [])[0] || {}).key;
    if (sig !== state.sig) { state.sig = sig; state.shown = 0; }
    if (first) state.selected = args.selected || "";
    if (first && args.sort) state.sortId = args.sort;
    render();
  });

  post("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
